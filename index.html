<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <div>
        <label for="name">Siapa nama anda? :</label>
        <div>
          <input type="text" id="name" />
        </div>
      </div>
      <div>
        <label for="age">Berapa umur anda?</label>
        <div>
          <input type="number" id="age" />
        </div>
      </div>
      <div>
        <label for="gender">Apa jenis kelamin anda?</label>
        <div>
          <input type="radio" value="male" name="gender" />Laki-laki
          <input type="radio" value="female" name="gender" /> Perempuan
        </div>
      </div>
      <div>
        <label for="smoke">Apakah anda perokok?</label>
        <div>
          <input type="radio" value="yes" name="quest" /> Ya
          <input type="radio" value="no" name="quest" /> Tidak
        </div>
      </div>
      <div>
        <label for="smoke"
          >Jika anda perokok, rokok apa yang anda pernah coba?</label
        >
        <div>
          <div>
            <input type="checkbox" name="cigarette" id="lucky-strike" /> Lucky
            Strike
          </div>
          <div>
            <input type="checkbox" name="cigarette" id="gudang-garam" /> Gudang
            Garam Filter
          </div>
          <div>
            <input type="checkbox" name="cigarette" id="marlboro" /> Marlboro
          </div>
          <div><input type="checkbox" name="cigarette" id="esse" /> Esse</div>
        </div>
        <div>
          <button type="submit">submit</button>
          <button type="reset">reset</button>
        </div>
      </div>
    </form>
    <div>
      <a href="tabel-data.html">Hasil Data Survey!</a>
    </div>
