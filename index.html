<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Perokok</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="form-header">
        <h1>Survey Perokok daerah Jakarta dan sekitarnya</h1>
        <p>Silakan isi form dengan baik dan benar.</p>
      </header>

      <form>
        <div class="question-card">
          <label class="question-title" for="name"> Siapa nama anda? </label>
          <input
            class="input-text"
            type="text"
            id="name"
            name="name"
            placeholder="Jawaban Anda" />
        </div>

        <div class="question-card">
          <label class="question-title" for="age"> Berapa umur anda? </label>
          <input
            class="input-number"
            type="number"
            id="age"
            name="age"
            placeholder="Jawaban Anda" />
        </div>

        <div class="question-card">
          <label class="question-title"> Apa jenis kelamin anda? </label>

          <label class="option">
            <input type="radio" name="gender" value="male" />
            Laki-laki
          </label>

          <label class="option">
            <input type="radio" name="gender" value="female" />
            Perempuan
          </label>
        </div>

        <div class="question-card">
          <label class="question-title"> Apakah anda perokok? </label>

          <label class="option">
            <input type="radio" name="smoke" value="yes" />
            Ya
          </label>

          <label class="option">
            <input type="radio" name="smoke" value="no" />
            Tidak
          </label>
        </div>

        <div class="question-card">
          <label class="question-title">
            Jika anda perokok, rokok apa yang pernah anda coba?
          </label>

          <label class="option">
            <input type="checkbox" name="cigarette" value="Lucky Strike" />
            Lucky Strike
          </label>

          <label class="option">
            <input
              type="checkbox"
              name="cigarette"
              value="Gudang Garam Filter" />
            Gudang Garam Filter
          </label>

          <label class="option">
            <input type="checkbox" name="cigarette" value="Marlboro" />
            Marlboro
          </label>

          <label class="option">
            <input type="checkbox" name="cigarette" value="Esse" />
            Esse
          </label>
        </div>

        <div class="button-group">
          <button class="submit" type="submit">Kirim</button>
          <button class="reset" type="reset">Clear Form</button>
        </div>
        <div><p>never submit through google forms.</p></div>
      </form>
    </div>
    <footer>
      <div class="footer-disclaimer">
        <span>This content is neither creaeted nor endorsed by Google</span>
      </div>
      <a href="tabel-data.html">Lihat Data Survey</a>
    </footer>
    <script>
      const form = document.querySelector("form");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(form);
        const name = formData.get("name");
        const age = formData.get("age");
        const gender = formData.get("gender");
        const smoke = formData.get("smoke");
        const cigarette = formData.getAll("cigarette");
        const respondent = {
          name: name,
          age: age,
          gender: gender,
          smoke: smoke,
          cigarette: cigarette,
        };

        const data = JSON.parse(localStorage.getItem("respondent")) || [];

        data.push(respondent);

        localStorage.setItem("respondent", JSON.stringify(data));

        console.log(respondent);
        console.log(data);

        form.reset();
      });
    </script>
  </body>
</html>
