<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
  </head>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    table {
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #4caf50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    a {
      border: 2px solid #4caf50;
      text-decoration: none;
      padding: 10px 100px;
      border-radius: 6px;
      background-color: white;
      cursor: pointer;
      color: #1a941e;
      &:hover {
        background-color: #4caf50;
        color: white;
      }
    }
  </style>
  <body>
    <div class="container">
      <h1>Tabel Data Survey Perokok</h1>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>umur</th>
            <th>Jenis Kelamin</th>
            <th>Perokok</th>
            <th>Merk Rokok</th>
          </tr>
        </thead>
        <tbody id="list-respondent"></tbody>
      </table>

      <div class="back-to-survey"><a href="index.html">Kembali Ke Form</a></div>
    </div>
    <script>
      const data = JSON.parse(localStorage.getItem("respondent")) || [];
      const listRespondent = $("#list-respondent");
      data.forEach((item, index) => {
        const row = $("<tr></tr>");
        const number = $("<td></td>");
        number.text(index + 1);
        const name = $("<td></td>");
        name.text(item.name);
        const age = $("<td></td>");
        age.text(item.age);
        const gender = $("<td></td>");
        gender.text(item.gender);
        const smoker = $("<td></td>");
        smoker.text(item.smoke);
        const cigarette = $("<td></td>");
        cigarette.text(item.cigarrete);

        row.append(number);
        row.append(name);
        row.append(age);
        row.append(gender);
        row.append(smoker);
        row.append(cigarette);
        listRespondent.append(row);
      });
    </script>
  </body>
</html>
