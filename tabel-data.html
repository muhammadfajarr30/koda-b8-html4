<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    table {
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #4caf50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    a {
      border: 2px solid #4caf50;
      text-decoration: none;
      padding: 10px 100px;
      border-radius: 6px;
      background-color: white;
      cursor: pointer;
      color: #1a941e;
      &:hover {
        background-color: #4caf50;
        color: white;
      }
    }
  </style>
  <body>
    <div class="container">
      <h1>Tabel Data Survey Perokok</h1>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>umur</th>
            <th>Jenis Kelamin</th>
            <th>Perokok</th>
            <th>Merk Rokok</th>
          </tr>
        </thead>
        <tbody id="list-respondent"></tbody>
      </table>

      <div class="back-to-survey"><a href="index.html">Kembali Ke Form</a></div>
    </div>
    <script>
      const listRespondent = document.getElementById("list-respondent");
      function renderTableData() {
        const data = JSON.parse(localStorage.getItem("respondent")) || [];
        data.forEach((person, index) => {
          const row = document.createElement("tr");
          const number = document.createElement("td");
          number.textContent = index + 1;
          const name = document.createElement("td");
          name.textContent = person.name;
          const age = document.createElement("td");
          age.textContent = person.age;
          const gender = document.createElement("td");
          if (person.gender === "male") {
            gender.textContent = "Laki-laki";
          } else {
            gender.textContent = "Perempuan";
          }
          const smoke = document.createElement("td");
          if (person.smoke === "yes") {
            smoke.textContent = "Iya";
          } else {
            smoke.textContent = "Tidak";
          }

          const cigaretteBrand = document.createElement("td");
          cigaretteBrand.textContent = person.cigarette.join(", ");

          row.appendChild(number);
          row.appendChild(name);
          row.appendChild(age);
          row.appendChild(gender);
          row.appendChild(smoke);
          row.appendChild(cigaretteBrand);

          listRespondent.appendChild(row);
        });
      }
      renderTableData();
    </script>
  </body>
</html>
